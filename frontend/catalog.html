<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вакансиялар — JumysHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">💼 JumysHub</a>
      <button class="burger" aria-label="Мәзір">☰</button>
      <nav class="nav">
        <a href="index.html">Басты бет</a>
        <a href="catalog.html" class="active">Вакансиялар</a>
        <a href="resume.html">Резюме жасау</a>
        <div class="nav-buttons">
          <a href="login.html" class="btn btn-outline">Кіру</a>
          <a href="register.html" class="btn">Тіркелу</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Вакансиялар</h1>
        <p>Жұмысты іздеңіз, сала мен қала бойынша сүзгілеңіз және ұнағанын сақтаңыз</p>
      </div>
    </section>

    <div class="container catalog-layout">
      <!-- Сүзгілер -->
      <aside class="filters">
        <h3>Сүзгілер</h3>
        <label for="search">Іздеу</label>
        <input type="text" id="search" placeholder="Лауазым немесе компания">

        <label for="category">Сала</label>
        <select id="category">
          <option value="all">Барлығы</option>
        </select>

        <label for="city">Қала</label>
        <select id="city">
          <option value="all">Барлығы</option>
        </select>

        <label for="sort">Сұрыптау</label>
        <select id="sort">
          <option value="new">Жаңалары алдымен</option>
          <option value="salary">Жалақысы жоғары</option>
          <option value="title">Атауы бойынша (А-Я)</option>
        </select>
      </aside>

      <!-- Вакансиялар -->
      <section>
        <div class="catalog-top">
          <span id="result-count"></span>
        </div>
        <div class="jobs-grid" id="catalog-jobs"></div>
        <p class="empty" id="empty">Вакансия табылмады 😔</p>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 JumysHub. Барлық құқықтар қорғалған.</p>
      <div>
        <a href="index.html">Басты бет</a>
        <a href="resume.html">Резюме жасау</a>
        <a href="login.html">Кіру</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
