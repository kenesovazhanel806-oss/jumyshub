<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Резюме жасау — JumysHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">💼 JumysHub</a>
      <button class="burger" aria-label="Мәзір">☰</button>
      <nav class="nav">
        <a href="index.html">Басты бет</a>
        <a href="catalog.html">Вакансиялар</a>
        <a href="resume.html" class="active">Резюме жасау</a>
        <div class="nav-buttons">
          <a href="login.html" class="btn btn-outline">Кіру</a>
          <a href="register.html" class="btn">Тіркелу</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Резюме жасау</h1>
      <p class="subtitle">Өзіңіз туралы негізгі ақпаратты толтырыңыз</p>

      <div class="message" id="form-message"></div>

      <form id="resume-form" novalidate>
        <div class="form-group">
          <label for="fullname">Аты-жөні</label>
          <input type="text" id="fullname" name="fullname" placeholder="Аты-жөніңіз">
          <p class="error-text"></p>
        </div>
        <div class="form-group">
          <label for="position">Қалаған лауазым</label>
          <input type="text" id="position" name="position" placeholder="Мысалы: Frontend әзірлеуші">
          <p class="error-text"></p>
        </div>
        <div class="form-group">
          <label for="phone">Телефон</label>
          <input type="tel" id="phone" name="phone" placeholder="+7 700 000 00 00">
          <p class="error-text"></p>
        </div>
        <div class="form-group">
          <label for="experience">Тәжірибе және дағдылар</label>
          <textarea id="experience" name="experience" rows="5" placeholder="Жұмыс тәжірибеңіз бен дағдыларыңыз"></textarea>
          <p class="error-text"></p>
        </div>
        <button type="submit" class="btn btn-block">Резюмені сақтау</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 JumysHub. Барлық құқықтар қорғалған.</p>
      <div>
        <a href="index.html">Басты бет</a>
        <a href="catalog.html">Вакансиялар</a>
        <a href="login.html">Кіру</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
